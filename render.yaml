services:
  - type: web
    name: financial-symphony
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # set these in the Render dashboard, never in git:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ONLINE_TOKEN
        sync: false
